# render.yaml — Blueprint de Render para la API principal.
#
# Deploy: sube este repo a GitHub → en Render "New Blueprint" conecta el repo
# (detecta este archivo automáticamente) → llena los secrets y deploy.
#
# Plan free: 750 h/mes. El servicio se duerme tras 15 min sin tráfico y
# despierta solo con la primera request (cold start ~1 min).
#
# Ojo: el plan free NO tiene disco persistente. DOCUMENTS_DIR y TRACKER_PATH
# se reinician en cada redeploy/restart.

services:
  - type: web
    name: open-ai-jobs-search-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Render inyecta PORT; el Dockerfile/entrypoint escuchan en 8000,
      # así que se fija explícitamente para que coincidan.
      - key: PORT
        value: "8000"

      # ── App ──────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_CONSOLE_LEVEL
        value: INFO

      # ── LLM ──────────────────────────────────────────────────────
      - key: LLM_DEFAULT_PROVIDER
        value: anthropic
      - key: LLM_TIMEOUT
        value: "180"

      # ── CORS: frontend real (Cloudflare) + localhost para dev ─
      # Debe ser JSON válido: el campo cors_origins es list[str] y
      # pydantic-settings lo parsea con json.loads. Sin barra final en
      # la URL (el header Origin no la trae y el match fallaría).
      - key: CORS_ORIGINS
        value: '["https://cvmeld.tonyml.com", "http://localhost:3000"]'

      # ── Secrets (llenar en Render Dashboard tras el primer deploy) ─
      # Los valores NO van en el repo: sync: false crea las variables
      # vacías y se completan manualmente en el dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

      # El microservicio de ingesta (Ingestión) expone /api/v1/ingest.
      # Tras desplegarlo en Render, apunta aquí a su URL onrender.com.
      - key: INGEST_SERVICE_URL
        sync: false

# ── Cron (opcional) ────────────────────────────────────────────────────────
# Si quieres limpieza periódica de datos viejos, Render puede disparar
# un job programado contra un endpoint:
#
# cron:
#   - name: housekeeping
#     schedule: "0 */6 * * *"
#     command: curl -fsS https://api.cvmeld.tonyml.com/api/v1/health
