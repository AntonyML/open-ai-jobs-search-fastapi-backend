name: Deploy FastAPI Backend to Fly.io

run-name: >
  Deploy Backend ${{ github.event.inputs.environment }}
  @ ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        type: choice
        required: true
        default: production
        options:
          - production

      confirm:
        description: "Type DEPLOY to confirm"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-backend-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'

    name: Deploy to ${{ github.event.inputs.environment }}

    runs-on: ubuntu-latest

    timeout-minutes: 20

    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install scraper dependencies
        shell: bash
        run: |
          for dir in app/external/scrapers/*/cli; do
            if [ -f "$dir/package.json" ]; then
              bun install --cwd "$dir"
            fi
          done

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Generate version tag
        id: version
        shell: bash
        run: |
          DATE_TAG=$(date +'v%Y.%m.%d')
          echo "VERSION=${DATE_TAG}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-${{ steps.version.outputs.VERSION }}
          name: "Backend ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🚀 Backend desplegado

            **Entorno:** ${{ github.event.inputs.environment }}

            **URL:** https://open-ai-jobs-search-fastapi.fly.dev/health

            **Desplegado por:** @${{ github.actor }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
