# fly.toml - Fly.io configuration for FastAPI backend
# Run: flyctl launch --no-deploy (then edit this file) or flyctl deploy

app = "open-ai-jobs-search-fastapi"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Application settings
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  
  # CORS - update with your frontend URL
  CORS_ORIGINS = '["https://your-frontend-domain.com"]'
  
  # LaTeX binary path (MiKTeX installed via apt on Debian bookworm)
  LATEX_BIN_DIR = "/usr/bin"
  
  # Default LLM provider
  LLM_DEFAULT_PROVIDER = "anthropic"
  
  # APScheduler
  SCRAPE_INTERVAL_HOURS = "6"

[processes]
  web = "uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
  worker = "python -m app.worker"

[[services]]
  internal_port = 8000
  processes = ["web"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  
  [[services.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "5s"
    method = "get"
    path = "/api/v1/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Secrets (set via flyctl secrets set)
# DATABASE_URL=postgresql+asyncpg://...
# JWT_SECRET_KEY=...
# ANTHROPIC_API_KEY=...
# OPENAI_API_KEY=...
# NVIDIA_NIM_API_KEY=...
# LM_STUDIO_API_BASE=...

# Volumes for persistent data (optional - for documents/tracker)
# [mounts]
#   source = "app_data"
#   destination = "/app/documents"