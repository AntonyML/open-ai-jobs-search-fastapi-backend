[project]
name = "open-ai-jobs-search"
version = "0.1.0"
description = "Backend FastAPI para búsqueda de empleos con IA multi-proveedor"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi[standard]>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<0.32.0",
    "alembic>=1.14.0,<2.0.0",
    "litellm>=1.60.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "httpx>=0.28.0,<0.29.0",
    "python-multipart>=0.0.18,<0.1.0",
    "sentry-sdk>=2.20.0,<3.0.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "aiocache>=0.12.0,<1.0.0",
    "typst>=0.13.0,<0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "httpx>=0.28.0,<0.29.0",
    "ruff>=0.9.0,<0.10.0",
    "mypy>=1.14.0,<2.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]